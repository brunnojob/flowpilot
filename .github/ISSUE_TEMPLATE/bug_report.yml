name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please remove secrets (tokens, chat ids) from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow definition
      description: The smallest workflow YAML that reproduces the problem.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Output of `flowpilot logs <run-id>` or the server log.
      render: text
  - type: input
    id: version
    attributes:
      label: flowpilot version
      placeholder: "flowpilot --version"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, Debian 12 / Raspberry Pi OS / Docker"
