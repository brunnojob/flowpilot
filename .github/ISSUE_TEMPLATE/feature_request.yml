name: Feature request
description: Suggest a new step type, trigger or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the automation you are trying to build.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could it look in a workflow YAML?
      render: yaml
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
