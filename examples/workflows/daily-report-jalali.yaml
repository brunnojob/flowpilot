name: daily-report-jalali
description: Check a website daily and send a Persian report with the Jalali date to Telegram.
tags: [monitoring, telegram, jalali]
trigger:
  type: cron
  cron: "0 9 * * *"
  timezone: Asia/Tehran

vars:
  url: https://example.com

steps:
  - id: check
    type: http
    with:
      url: "{{ vars.url }}"
      timeout: 15
      fail_on_error: false

  - id: report
    type: transform
    with:
      template: |
        <b>گزارش روزانه وضعیت وب‌سایت</b>
        تاریخ: {{ now('Asia/Tehran') | jalali('%d %B %Y', true) }}
        نشانی: {{ vars.url | e }}
        وضعیت: {{ 'در دسترس' if steps.check.output.ok else 'خطای HTTP' }}
        کد HTTP: {{ steps.check.output.status | fa_digits }}
        زمان پاسخ: {{ steps.check.output.elapsed_ms | fa_digits }} میلی‌ثانیه

  - id: send
    type: telegram
    with:
      text: "{{ steps.report.output }}"
