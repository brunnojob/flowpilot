[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "flowpilot"
dynamic = ["version"]
description = "A lightweight, self-hosted, code-first workflow automation engine with first-class Telegram support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammadreza Zare" }]
keywords = [
  "automation",
  "workflow",
  "workflow-engine",
  "telegram",
  "telegram-bot",
  "cron",
  "webhook",
  "self-hosted",
  "fastapi",
  "asyncio",
  "n8n-alternative",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "croniter>=2.0",
  "fastapi>=0.110",
  "feedparser>=6.0.10",
  "httpx>=0.26",
  "Jinja2>=3.1.3",
  "jmespath>=1.0",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0.3",
  "uvicorn>=0.27",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
socks = ["httpx[socks]>=0.26"]
dev = [
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "respx>=0.21",
  "ruff>=0.6",
  "types-PyYAML",
  "types-croniter",
  "types-jmespath",
]

[project.scripts]
flowpilot = "flowpilot.cli:main"

[project.urls]
Homepage = "https://mrzroot.github.io/flowpilot/"
Repository = "https://github.com/mrzroot/flowpilot"
Issues = "https://github.com/mrzroot/flowpilot/issues"
Changelog = "https://github.com/mrzroot/flowpilot/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/flowpilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot"]

[tool.hatch.build.targets.sdist]
include = [
  "src/flowpilot",
  "tests",
  "examples",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "ASYNC"]
ignore = ["RUF012", "B008", "ASYNC109", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT011", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:feedparser.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["flowpilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
packages = ["flowpilot"]
