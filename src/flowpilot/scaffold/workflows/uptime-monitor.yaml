# Checks your sites every 5 minutes and alerts Telegram only when a site goes
# down or comes back. Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env,
# then enable it from the dashboard (or change `enabled` to true).
name: uptime-monitor
description: Alert on Telegram when a website goes down or recovers.
enabled: false
trigger:
  type: interval
  seconds: 300

vars:
  sites:
    - https://example.com
    - https://www.python.org

steps:
  - id: check
    type: http
    for_each: "{{ vars.sites }}"
    continue_on_error: true
    timeout: 20
    with:
      url: "{{ item }}"
      fail_on_error: false
      timeout: 15

  - id: alert
    type: telegram
    for_each: "{{ steps.check.results }}"
    if: "{{ (item.ok and item.output.ok) != (state.up or {}).get(item.item, true) }}"
    with:
      text: >-
        {% if item.ok and item.output.ok %}✅ <b>{{ item.item }}</b> is back up
        ({{ item.output.status }}, {{ item.output.elapsed_ms }} ms){% else %}🔴 <b>{{ item.item }}</b>
        is DOWN: {{ item.error or ('HTTP ' ~ item.output.status) }}{% endif %}

  - id: remember
    type: state
    for_each: "{{ steps.check.results }}"
    with:
      merge:
        up:
          "{{ item.item }}": "{{ item.ok and item.output.ok }}"
